<div class="container">

  <div class="col-sm-12 col-lg-6 offset-lg-3">
    <h1 class="text-center">Controle de Atividades Físicas</h1>
  </div>
  <hr>

  <!-- Filtros -->
  <div class="card p-3 shadow-sm mb-4">
    <h5 class="card-title text-success mb-3">
      <i class="bi bi-funnel-fill"></i> Filtros de Pesquisa
    </h5>
    <form autocomplete="off" (ngSubmit)="search()">
      <div class="row">
        <div class="col-md-4 mb-2">
          <label>Tipo</label>
          <p-select styleClass="w-100" [options]="types" placeholder="Selecione" name="type"
            [(ngModel)]="filter.type"></p-select>
        </div>
        <div class="col-md-3 mb-2">
          <label>Data inicial</label>
          <p-datepicker styleClass="w-100" inputStyleClass="w-100" dateFormat="dd/mm/yy"
            [(ngModel)]="filter.initialDate" name="initialDate"></p-datepicker>
        </div>
        <div class="col-md-3 mb-2">
          <label>Data final</label>
          <p-datepicker styleClass="w-100" inputStyleClass="w-100" dateFormat="dd/mm/yy"
            [(ngModel)]="filter.finalDate" name="finalDate"></p-datepicker>
        </div>
        <div class="col-md-2 mb-2 d-flex align-items-end">
          <button type="submit" class="btn btn-primary">Filtrar</button>
        </div>
      </div>
    </form>
  </div>

  <!-- Tabela -->
  <div class="card p-3 shadow-sm mb-3">
    <p-table [value]="activities" responsiveLayout="stack" [breakpoint]="'768px'"
      [lazy]="true" [paginator]="true" [rows]="filter.itemsPerPage"
      [totalRecords]="totalRecords" [(first)]="first"
      sortField="date" [sortOrder]="-1"
      (onLazyLoad)="whenChangePage($event)">
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="type">Categoria <p-sortIcon field="type"></p-sortIcon></th>
          <th pSortableColumn="date">Data de Realização <p-sortIcon field="date"></p-sortIcon></th>
          <th pSortableColumn="distance">Distância <p-sortIcon field="distance"></p-sortIcon></th>
          <th pSortableColumn="duration">Duração <p-sortIcon field="duration"></p-sortIcon></th>
          <th class="col-actions-header">Ações</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-activity>
        <tr>
          <td>
            <span class="p-column-title">Categoria</span>
            <span *ngIf="activity.type === 'CORRIDA'">
              <img src="running_icon.png" alt="Corrida">
            </span>
            <span *ngIf="activity.type === 'CAMINHADA'">
              <img src="walking_icon.png" alt="Caminhada">
            </span>
            <span *ngIf="activity.type === 'CICLISMO'">
              <img src="cycling_icon.png" alt="Ciclismo">
            </span>
            <span *ngIf="activity.type === 'NATACAO'">
              <img src="swimming_icon.png" alt="Natação">
            </span>
          </td>
          <td><span class="p-column-title">Data</span>{{ activity.date }}</td>
          <td><span class="p-column-title">Distância</span>{{ activity.distance | number: '1.1-1'}} km</td>
          <td><span class="p-column-title">Duração</span>{{ activity.duration }} min</td>
          <td class="text-nowrap">
            <a class="btn btn-sm btn-primary me-1" [routerLink]="['/activities', activity.id]">
              Editar
            </a>
            <button type="button" class="btn btn-sm btn-danger"
              (click)="confirmRemoval(activity)"
              [disabled]="!auth.hasPermission('ROLE_REMOVE_ACTIVITY')">
              Excluir
            </button>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="5" class="text-center">
            Nenhuma atividade registrada.
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>

  <div class="col-lg-4 offset-lg-4 col-sm-12 d-grid">
    <a class="btn btn-success" routerLink="/activities/new">
      <i class="bi bi-plus-circle-fill me-1"></i> Nova Atividade
    </a>
  </div>

</div>
