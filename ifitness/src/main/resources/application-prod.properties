# Configuracoes do ambiente de producao.
# Os valores sensiveis NAO ficam no codigo: vem de variaveis de ambiente
# cadastradas na plataforma de hospedagem.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=false

ifitness.cors.allowed-origin=${FRONT_URL}
ifitness.jwt.access-token-seconds=900
ifitness.jwt.private-key=${JWT_PRIVATE_KEY}
ifitness.cookie.path=/api/auth
ifitness.cookie.secure=true